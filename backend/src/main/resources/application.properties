# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fastfit_db
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/products
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Email (Resend.com - free tier: 3000 emails/month)
# Sign up at https://resend.com and get your API key
# Format: re_xxxxxxxxxxxx
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com

# App
app.frontend.url=http://localhost:5173
app.email.from=FastFit <onboarding@resend.dev>
app.dev-mode=true
pix.key=${PIX_KEY:}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Evolution API para WhatsApp
# URL base da Evolution API (ex: http://localhost:3000)
evolution.api.url=${EVOLUTION_API_URL:}
# Chave de autenticação da Evolution API
evolution.api.key=${EVOLUTION_API_KEY:}
# Nome da instância WhatsApp configurada na Evolution API
evolution.api.instance=${EVOLUTION_INSTANCE:fastfit}
# Ativar/desativar envio de mensagens WhatsApp
evolution.api.enabled=${EVOLUTION_API_ENABLED:false}

# Firebase Admin SDK (cole o JSON da chave de servico em UMA LINHA, sem quebras)
# Gere em: Firebase Console > Configuracoes > Contas de servico > Gerar nova chave privada
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON}
