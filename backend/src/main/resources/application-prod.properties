# Database (Railway vai fornecer a URL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
# O projeto ainda não usa migrations; cria/atualiza tabelas novas em cada deploy.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/products

# Cloudinary (opcional). Quando configurado, imagens sobrevivem a novos deploys.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Email (Resend)
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com

# App
app.frontend.url=${FRONTEND_URL}
app.email.from=FastFit <onboarding@resend.dev>
app.dev-mode=false
pix.key=${PIX_KEY}

# Firebase
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT}

# Swagger
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# WhatsApp / Evolution API
evolution.api.enabled=${WHATSAPP_ENABLED:false}
evolution.api.url=${WHATSAPP_EVOLUTION_URL:}
evolution.api.key=${WHATSAPP_EVOLUTION_APIKEY:}
evolution.api.instance=${WHATSAPP_EVOLUTION_INSTANCE:fastfit}

# n8n
n8n.webhook.secret=${N8N_WEBHOOK_SECRET:}

spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo
